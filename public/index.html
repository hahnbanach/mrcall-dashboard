<!DOCTYPE html>
<html lang="">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta http-equiv="description" content="La tua azienda ha bisogno di qualcuno che risponda sempre al telefono? Il risponditore telefonico del futuro è qui, prova Mrcall."/>
    <link rel="icon" href="<%= BASE_URL %>favicon.ico">
    <title><%= htmlWebpackPlugin.options.title %></title>
    <!-- The splash: drawn from the first byte, before any script or stylesheet arrives, and replaced by the app when it
         mounts (plan docs/execution-plans/2026-10-23-dashboard-load.md, M6). Inline, with no text to translate; the
         background is @mrcall_background and the ring @mrcall_blue (src/assets/style/colors.less). App.vue shows the
         same while the first page resolves, so the two read as one. -->
    <style>
        body { margin: 0; background: #E5E5E5; }
        .app-splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #E5E5E5; }
        .app-splash-ring { width: 40px; height: 40px; border-radius: 50%; border: 4px solid rgba(0, 104, 255, 0.2); border-top-color: #0068FF; animation: app-splash-turn 0.9s linear infinite; }
        @keyframes app-splash-turn { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { .app-splash-ring { animation-duration: 3s; } }
    </style>
</head>
<body>
<noscript>
    <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled.
        Please enable it to continue with the <%= htmlWebpackPlugin.options.title %> website.</strong>
</noscript>
<div id="app"><div class="app-splash" aria-busy="true"><div class="app-splash-ring"></div></div></div>
<!-- built files will be auto injected -->
</body>
</html>
